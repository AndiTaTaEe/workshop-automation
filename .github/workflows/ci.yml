name: Code Verification (CI)

# Step 1: When should it run?
on: [push, pull_request]

# Step 2: Which runner do we use and what steps do we execute?
jobs:
  matrix_build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # Clones the repository code into the virtual machine
      - name: Checkout repository code
        uses: actions/checkout@v4

      # compile using gcc/clang on linux + macos and gcc on windows
      - name: Compile C program
        shell: bash
        run: |
          mkdir -p build
          gcc c-bye/bye.c -o build/bye

      - name: Run application
        shell: bash
        run: ./build/bye